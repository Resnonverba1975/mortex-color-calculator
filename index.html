<style>
:root{--bg:#f3f0ea;--card:#fff;--ink:#242320;--muted:#77736d;--line:#dedbd5}

.wrap{max-width:620px;margin:auto;padding:18px 14px 44px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}

.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:0}.modal.show{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;width:min(620px,100%);max-height:88vh;overflow:auto;padding:18px 16px 28px}.handle{width:42px;height:5px;background:#d5d2cc;border-radius:5px;margin:0 auto 16px}.hero{display:flex;gap:14px;align-items:center}.hero .swatch{width:92px;height:92px;border-radius:16px;flex:0 0 92px}.hero h2{margin:0;font-size:24px}.hero p{margin:5px 0;color:var(--muted)}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:18px}
.card{background:#f7f5f1;border-radius:17px;padding:15px;margin-top:16px}label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:7px}input[type=number]{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:18px;background:#fff}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.quick button,.copy{border:0;background:#242320;color:#fff;border-radius:10px;padding:9px 12px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e4e1dc}.row:last-child{border-bottom:0}.grams{font-weight:800}.note{font-size:11px;color:#777;margin-top:14px;line-height:1.45}

<style>

 grid.innerHTML=list.map(c=>`<button class="tile" onclick="openColor('${c.code}')"><div class="swatch" style="background:${c.color}"></div><div class="tilebody"><div class="code">${c.code}</div><div class="name">${c.name}</div></div></button>`).join("");
}
function openColor(code){
 selected=colors.find(c=>c.code===code);
 const kg=1;
 document.getElementById("detail").innerHTML=`
 <div class="hero"><div class="swatch" style="background:${selected.color}"></div><div><h2>${selected.code}</h2><p>${selected.name}</p></div></div>
 <div class="card"><label>HOEVEELHEID MORTEX COLOR 2-N (KG)</label><input id="kg" type="number" min="0" step="0.1" value="1" oninput="calc()"><div class="quick">
   <button onclick="setKg(.5)">0,5 kg</button><button onclick="setKg(1)">1 kg</button><button onclick="setKg(2.5)">2,5 kg</button><button onclick="setKg(5)">5 kg</button><button onclick="setKg(10)">10 kg</button>
 </div></div>
 <div class="card"><div id="formula"></div><button class="copy" onclick="copyFormula()">Kopieer formule</button></div>
 <div class="note"><strong>Extra kleuren:</strong> referentieformules uit een externe MORTEX-formulelijst. Controleer de actuele BEAL-documentatie voor productiegebruik.<br><br>De kleurstaal is een visuele indicatie. BEAL vermeldt dat kleuren op de kaart kunnen afwijken van het uiteindelijke aangebrachte MORTEX-resultaat. Formules zijn in deze versie opgenomen uit de geraadpleegde MORTEX-formulelijst; controleer de actuele BEAL-documentatie voor gebruik.</div>`;
 calc(); document.getElementById("modal").classList.add("show");
}
function calc(){
 const kg=parseFloat(document.getElementById("kg")?.value)||0;
 const total=selected.pigments.reduce((s,p)=>s+p.perKg*kg,0);
 document.getElementById("formula").innerHTML=selected.pigments.map(p=>`<div class="row"><span>${p.name}</span><span class="grams">${(p.perKg*kg).toFixed(2).replace(".",",")} g</span></div>`).join("")+
 `<div class="row"><strong>Totaal pigment</strong><strong class="grams">${total.toFixed(2).replace(".",",")} g</strong></div>`;
}
function setKg(v){document.getElementById("kg").value=v;calc()}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function copyFormula(){
 const kg=parseFloat(document.getElementById("kg").value)||0;
 const lines=selected.pigments.map(p=>`${p.name}: ${(p.perKg*kg).toFixed(2)} g`).join("\\n");
 navigator.clipboard?.writeText(`${selected.code} ${selected.name} — ${kg} kg MORTEX\\n${lines}`);
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script>
